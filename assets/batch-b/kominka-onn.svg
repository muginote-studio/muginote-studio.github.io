<text x="500" y="350" fill="#303328" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="65" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs">古民家カフェ</text>
