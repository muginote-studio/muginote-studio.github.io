<text x="500" y="405" fill="#50362d" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="150" text-anchor="middle" textLength="360" lengthAdjust="spacingAndGlyphs">喫茶</text>
