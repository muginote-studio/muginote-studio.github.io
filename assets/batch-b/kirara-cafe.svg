<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">キララカフェ 非公式デザイン案</title>
<desc id="desc">店舗名と公開資料を参考にした配色による自主制作のタイポグラフィ。店舗の公式ロゴではありません。</desc>
<rect width="1000" height="1000" fill="#f0e9db"/>
<path d="M72 155H928 M72 830H928" fill="none" stroke="#4c3d2a" stroke-width="1.5" opacity="0.4"/>
<text x="76" y="111" fill="#4c3d2a" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="4">UNOFFICIAL DESIGN</text>
<text x="924" y="111" text-anchor="end" fill="#4c3d2a" font-family="Arial, Helvetica, sans-serif" font-size="23">奈良県</text>
<path d="M75 190H120" stroke="#725b39" stroke-width="5"/>
<text x="500" y="465" fill="#4c3d2a" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="170" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs">キララ</text>
<text x="500" y="670" fill="#4c3d2a" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="150" text-anchor="middle" textLength="620" lengthAdjust="spacingAndGlyphs">カフェ</text>
<text x="76" y="882" fill="#4c3d2a" font-family="Arial, Helvetica, sans-serif" font-size="23" textLength="140" lengthAdjust="spacingAndGlyphs">キララカフェ</text>
<text x="76" y="927" fill="#4c3d2a" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">自主制作・店舗未承認</text>
</svg>
