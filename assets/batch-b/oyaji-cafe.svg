<text x="924" y="111" text-anchor="end" fill="#f0e5cf" font-family="Arial, Helvetica, sans-serif" font-size="23">鳥取県</text>
<path d="M75 190H120" stroke="#d7bc8c" stroke-width="5"/>
<text x="500" y="465" fill="#f0e5cf" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="180" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs">おやじ</text>
<text x="500" y="675" fill="#f0e5cf" font-family="'Yu Mincho', 'Hiragino Mincho ProN', serif" font-weight="400" font-style="normal" font-size="180" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs">かふぇ</text>
<text x="76" y="882" fill="#f0e5cf" font-family="Arial, Helvetica, sans-serif" font-size="23" textLength="140" lengthAdjust="spacingAndGlyphs">おやじかふぇ</text>
<text x="76" y="927" fill="#f0e5cf" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">自主制作・店舗未承認</text>
