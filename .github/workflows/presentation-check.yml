name: Presentation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check icons, SVGs and local references
        run: python3 scripts/check_presentation.py
      - name: Check collection entries and assets
        run: python3 scripts/check_collection.py
      - name: Check search, category and region interactions
        run: node --test scripts/check_collection.cjs

